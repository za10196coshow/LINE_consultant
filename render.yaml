services:
  - type: web
    name: line-ai-kanji
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: TIMEZONE
        value: Asia/Tokyo
      - key: OPENAI_MODEL
        value: gpt-5-mini
      - key: OPENAI_TIMEOUT_SECONDS
        value: 45
      - key: OPENAI_SEARCH_TIMEOUT_SECONDS
        value: 75
      - key: DATABASE_PATH
        value: /opt/render/project/src/data/kanji.db
      - key: LINE_CHANNEL_SECRET
        sync: false
      - key: LINE_CHANNEL_ACCESS_TOKEN
        sync: false
      - key: OPENAI_API_KEY
        sync: false
