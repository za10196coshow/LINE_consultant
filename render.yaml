services:
  - type: web
    name: line-ai-kanji
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: TIMEZONE
        value: Asia/Tokyo
      - key: OPENAI_MODEL
        value: gpt-5-mini
      - key: OPENAI_TIMEOUT_SECONDS
        value: 45
      - key: OPENAI_SEARCH_TIMEOUT_SECONDS
        value: 75
      - key: DAILY_API_BUDGET_JPY
        value: 100
      - key: DAILY_API_STOP_THRESHOLD_JPY
        value: 90
      - key: USD_JPY_RATE
        value: 150
      - key: CONVERSATION_ASSISTANT_COOLDOWN_MINUTES
        value: 20
      - key: UNANSWERED_QUESTION_DELAY_SECONDS
        value: 30
      - key: UNANSWERED_QUESTION_DELAY_MESSAGES
        value: 1
      - key: CONVERSATION_ASSISTANT_CONFIDENCE_THRESHOLD
        value: 0.78
      - key: CONVERSATION_PROACTIVE_THRESHOLD
        value: 0.65
      - key: CONVERSATION_NEED_CONFIDENCE_THRESHOLD
        value: 0.60
      - key: CONVERSATION_EXPECTED_HELPFULNESS_THRESHOLD
        value: 0.70
      - key: CONVERSATION_INTRUSIVENESS_RISK_MAX
        value: 0.45
      - key: CONVERSATION_INTERVENTION_SCORE_THRESHOLD
        value: 0.25
      - key: DATABASE_PATH
        value: /opt/render/project/src/data/kanji.db
      - key: LINE_CHANNEL_SECRET
        sync: false
      - key: LINE_CHANNEL_ACCESS_TOKEN
        sync: false
      - key: OPENAI_API_KEY
        sync: false
